<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON TENNIS · 霓虹网球</title>
<style>
:root{--cyan:#63f4ed;--pink:#ff5ea8;--gold:#ffd66b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at top,#172c49,#050a14 70%);color:#eaf8ff;font-family:system-ui,sans-serif;touch-action:none}body{display:grid;place-items:center;padding:12px}#app{width:min(520px,calc((100dvh - 24px)*.75),calc(100vw - 24px));aspect-ratio:3/4;position:relative;border-radius:22px;overflow:hidden;box-shadow:0 0 50px #21d9e533}canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:#07101edc;backdrop-filter:blur(8px)}.hide{display:none!important}.panel{width:100%;max-width:380px;text-align:center;padding:24px 20px;border:1px solid #71f8ee66;border-radius:22px;background:linear-gradient(145deg,#122943f5,#091728f5)}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.22em;font-weight:800}.logo{font-size:clamp(30px,8vw,44px);font-weight:950;margin:10px 0;text-shadow:0 0 24px #36f7e866}.logo span{color:var(--pink)}p{color:#a9bfd2;font-size:13px;line-height:1.6}.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin:18px 0}.rules div{padding:10px;border-radius:10px;background:#ffffff0a;font-size:12px}.rules b{display:block;color:var(--cyan);margin-bottom:4px}button{width:100%;border:0;border-radius:12px;padding:13px;margin:5px 0;font:inherit;font-weight:800;background:linear-gradient(110deg,#6dfff0,#62cfff);color:#06111d;cursor:pointer}.secondary{background:#ffffff0b;color:#eaf8ff;border:1px solid #91b9d444}.stats{display:flex;justify-content:space-around;margin:18px 0}.stats b{display:block;font-size:24px;color:var(--cyan)}@media(max-height:650px){.panel{padding:14px}.rules{margin:8px 0}.rules div{padding:6px}}
</style></head><body><div id="app"><canvas id="c"></canvas>
<section class="overlay" id="menu"><div class="panel"><div class="eyebrow">ARCADE · 01 PLAYER</div><div class="logo">NEON <span>TENNIS</span></div><p>接住每一球，打出你的连击。</p><div class="rules"><div><b>⌨ 键盘</b>A / D 或 ← / → 移动<br>Space 暂停 · R 重开</div><div><b>☝ 鼠标 / 触摸</b>左右移动或拖动球拍</div><div><b>✦ 完美击球</b>球拍中心击球得分更高</div><div><b>↗ 不断升级</b>连击越多，球速越快</div></div><button id="start">开始比赛</button><p>用球拍回击对手的球，别让球从你身后飞过！</p></div></section>
<section class="overlay hide" id="over"><div class="panel"><div class="eyebrow">MATCH COMPLETE</div><h2>比赛结束</h2><div class="stats"><div><b id="score">0</b><small>本局得分</small></div><div><b id="combo">0</b><small>最高连击</small></div><div><b id="level">1</b><small>等级</small></div></div><button id="again">再来一局</button><button class="secondary" id="home">返回首页</button></div></section>
<section class="overlay hide" id="pause"><div class="panel"><div class="eyebrow">PAUSED</div><h2>比赛暂停</h2><button id="resume">继续比赛</button><button class="secondary" id="restart">重新开始</button></div></section></div>
<script>
(()=>{'use strict';const c=document.querySelector('#c'),g=c.getContext('2d'),W=450,H=600;let scene='menu',score=0,combo=0,maxCombo=0,hits=0,lives=3,level=1,px=W/2,ax=W/2,b={x:W/2,y:H/2,vx:90,vy:270},last=0,keys={},target=px,particles=[];
const $=id=>document.getElementById(id),clamp=(v,a,z)=>Math.max(a,Math.min(z,v)),rand=(a,z)=>a+Math.random()*(z-a);
function fit(){let d=window.devicePixelRatio||1;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0)}fit();addEventListener('resize',fit);
function show(s){scene=s;['menu','over','pause'].forEach(id=>$(id).classList.toggle('hide',id!==s))}
function serve(up){b={x:W/2,y:up?H*.68:H*.32,vx:rand(-100,100),vy:up?-1:1};let speed=260+level*17;b.vy*=speed;b.vx*=speed/2;px=W/2;ax=W/2}
function start(){score=combo=maxCombo=hits=0;lives=3;level=1;particles=[];serve(false);show('playing')}
$('start').onclick=start;$('again').onclick=start;$('restart').onclick=start;$('resume').onclick=()=>show('playing');$('home').onclick=()=>show('menu');
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key===' '){if(scene==='playing')show('pause');else if(scene==='pause')show('playing');else if(scene==='menu')start()}if(e.key.toLowerCase()==='r')start()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function pos(e){let r=c.getBoundingClientRect();target=clamp((e.clientX-r.left)/r.width*W,55,W-55);if(e.type==='pointerdown')px=target}c.addEventListener('pointerdown',pos);c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)pos(e)});
function burst(x,y,color){for(let i=0;i<18;i++)particles.push({x,y,vx:rand(-150,150),vy:rand(-150,150),life:.45,color})}
function update(dt){let speed=350+level*15;if(keys.a||keys.arrowleft)px-=speed*dt;if(keys.d||keys.arrowright)px+=speed*dt;if(!keys.a&&!keys.d&&!keys.arrowleft&&!keys.arrowright)px+=(target-px)*Math.min(1,dt*12);px=clamp(px,75,W-75);
ax+=(clamp(b.x+rand(-25,25),70,W-70)-ax)*Math.min(1,dt*(1.8+level*.12));
b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<38||b.x>W-38){b.x=clamp(b.x,38,W-38);b.vx*=-1;burst(b.x,b.y,'#63f4ed')}
if(b.vy<0&&b.y<88&&Math.abs(b.x-ax)<66){b.vy=Math.abs(b.vy);b.vx+=(b.x-ax)*2.8;hits++;combo++;maxCombo=Math.max(combo,maxCombo);score+=10+combo*2;if(hits%5===0)level++;burst(b.x,b.y,'#ff5ea8')}
if(b.vy>0&&b.y>515&&b.y<548&&Math.abs(b.x-px)<58){let perfect=Math.abs(b.x-px)<13;b.vy=-Math.abs(b.vy)*(perfect?1.12:1);b.vx+=(b.x-px)*3.2;b.vx=clamp(b.vx,-420,420);hits++;combo++;maxCombo=Math.max(combo,maxCombo);score+=perfect?50+combo*3:10+combo*2;if(hits%5===0)level++;if(perfect)burst(b.x,b.y,'#ffd66b');else burst(b.x,b.y,'#63f4ed')}
if(b.y>H+10){lives--;combo=0;if(lives<=0){$('score').textContent=score;$('combo').textContent=maxCombo;$('level').textContent=level;show('over')}else serve(false)}if(b.y<-10)serve(true);
particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt})}
function round(x,y,w,h,r,fill){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function draw(){g.clearRect(0,0,W,H);let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0d2037');bg.addColorStop(1,'#050b15');g.fillStyle=bg;g.fillRect(0,0,W,H);g.strokeStyle='#63f4ed19';for(let x=15;x<W;x+=30){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=15;y<H;y+=30){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
g.shadowBlur=12;g.strokeStyle='#8afcf0a0';g.strokeRect(30,18,390,564);g.setLineDash([5,7]);g.beginPath();g.moveTo(58,18);g.lineTo(58,582);g.moveTo(392,18);g.lineTo(392,582);g.stroke();g.setLineDash([]);g.fillStyle='#b8ffff66';g.fillRect(30,296,390,8);
function paddle(x,y,col){g.shadowColor=col;g.shadowBlur=18;let gr=g.createLinearGradient(x-43,y,x+43,y);gr.addColorStop(0,'#ffffff');gr.addColorStop(.5,col);gr.addColorStop(1,'#5bafff');round(x-43,y-7,86,14,7,gr);g.shadowBlur=0}paddle(ax,75,'#ff5ea8');paddle(px,525,'#63f4ed');
g.shadowColor='#d5fff8';g.shadowBlur=18;g.fillStyle='#eaffff';g.beginPath();g.arc(b.x,b.y,7,0,Math.PI*2);g.fill();g.shadowBlur=0;particles.forEach(p=>{g.globalAlpha=Math.max(0,p.life/.45);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,3,0,7);g.fill()});g.globalAlpha=1;g.fillStyle='#e8faff';g.font='800 16px system-ui';g.textAlign='left';g.fillText('分数 '+score,34,48);g.fillStyle='#80fff1';g.font='700 12px system-ui';g.fillText('COMBO ×'+combo,34,68);g.textAlign='right';g.fillStyle='#ff91bd';g.fillText('AI',416,48);g.fillStyle='#ffd66b';g.fillText('Lv.'+level,416,68);g.textAlign='left';g.fillStyle='#ff6e91';g.font='15px system-ui';g.fillText('♥ '.repeat(lives),34,576);if(scene==='pause'){g.fillStyle='#02081288';g.fillRect(0,0,W,H)}}
function frame(t){let dt=Math.min((t-last)/1000,.033)||0;last=t;if(scene==='playing')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();</script></body></html>
